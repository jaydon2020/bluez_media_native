name: CI

on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Format ────────────────────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install native format deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-19
      - run: dart pub get
      - run: dart format --set-exit-if-changed example/ hook/ lib/ test/
      - run: ./scripts/clang_format.sh check

  # ── Static analysis + pub points dry-run ─────────────────────────────────
  analyze:
    name: Dart analyze + pub dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      # Verify all pub.dev requirements pass before any PR merges
      - run: dart pub publish --dry-run

  test-dart:
    name: Dart unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsystemd-dev dbus-daemon python3-dbus python3-gi
      - run: dart pub get
      - run: dart test
      - name: Private D-Bus integration tests
        run: |
          cmake -S native -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel
          ./scripts/test_dbus.sh
      - name: Relocated compiled native asset bundle
        run: ./scripts/test_asset.sh

  # ── C++ unit tests ───────────────────────────────────────────────────────
  test-cpp:
    name: C++ unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang-19 \
            libsystemd-dev
      - name: Build + test
        run: |
          cmake -B build native/ -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -j4

  # ── ASAN + UBSan ─────────────────────────────────────────────────────────
  asan:
    name: ASAN + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-19 libclang-rt-19-dev \
            libsystemd-dev dbus-daemon python3-dbus python3-gi
      - run: ./scripts/asan.sh build-asan
      - name: Sanitized native lifecycle and concurrency integration
        run: BLUEZ_TEST_BUILD_DIR="$PWD/build-asan" BLUEZ_TEST_NATIVE_ONLY=1 ./scripts/test_dbus.sh

  # ── clang-tidy ───────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            clang-19 clang-tidy-19 \
            libsystemd-dev
      - name: Build (for compile_commands.json)
        run: |
          cmake -B build native/ -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DBUILD_TESTING=ON
          cmake --build build --parallel
      - run: ./scripts/clang_tidy.sh build

  # ── Coverage (main repo PRs + main pushes) ──────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: [test-cpp]
    if: >
      github.repository == 'jaydon2020/bluez_media_native' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ \
            libsystemd-dev lcov
      - run: ./scripts/coverage.sh build-cov
